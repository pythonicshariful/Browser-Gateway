<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Authentication - HS Economics Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-wrapper {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        .login-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
        }
        .error-message {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="background-glow"></div>

    <div class="app-container">
        <div class="login-wrapper">
            <div class="card login-card">
                <div class="login-icon">🔒</div>
                <h2>Admin Access Only</h2>
                <p class="subtitle" style="margin-bottom: 24px;">Please enter the admin password to manage sessions and cookies</p>

                {% if error %}
                <div class="error-message">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST" action="/admin/login" class="cookie-form">
                    <div class="form-group" style="text-align: left;">
                        <label for="password">Admin Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" name="password" placeholder="Enter password..." required autofocus>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">
                        Authenticate &rarr;
                    </button>
                </form>

                <p style="margin-top: 20px; font-size: 12px; color: var(--text-muted);">
                    Default password: <code style="color: #60a5fa;">admin</code>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
